name: Release extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}."
            exit 1
          fi
          test -f "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Test and build extension
        run: pnpm verify

      - name: Package extension
        shell: bash
        run: |
          archive="xhs-clipper-${GITHUB_REF_NAME}.zip"
          (cd dist && zip -q -r "../${archive}" .)
          sha256sum "${archive}" > "${archive}.sha256"
          cp "docs/releases/${GITHUB_REF_NAME}.md" release-notes.md
          hash="$(sha256sum "${archive}" | cut -d ' ' -f 1)"
          printf '\n\nSHA-256: `%s`\n' "${hash}" >> release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archive="xhs-clipper-${GITHUB_REF_NAME}.zip"
          gh release create "${GITHUB_REF_NAME}" \
            "${archive}" \
            "${archive}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "XHS Clipper ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
