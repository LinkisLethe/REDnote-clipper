name: Release extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}."
            exit 1
          fi
          test -f "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Test and build extension
        run: pnpm verify

      - name: Package extension
        shell: bash
        run: |
          archive="xhs-clipper-${GITHUB_REF_NAME}.zip"
          (cd dist && zip -q -r "../${archive}" .)
          sha256sum "${archive}" > "${archive}.sha256"
          cp "docs/releases/${GITHUB_REF_NAME}.md" release-notes.md
          hash="$(sha256sum "${archive}" | cut -d ' ' -f 1)"
          printf '\n\nSHA-256: `%s`\n' "${hash}" >> release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archive="xhs-clipper-${GITHUB_REF_NAME}.zip"
          gh release create "${GITHUB_REF_NAME}" \
            "${archive}" \
            "${archive}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "XHS Clipper ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
