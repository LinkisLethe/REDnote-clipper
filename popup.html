<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XHS Clipper</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">M</div>
        <div class="brand-copy">
          <h1 data-i18n="extensionName">XHS Clipper</h1>
          <p data-i18n="appSubtitle">单篇与批量剪藏到 Markdown</p>
        </div>
        <div class="header-actions">
          <button id="settingsButton" class="icon-button" type="button" data-i18n-title="settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" />
              <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z" />
            </svg>
          </button>
          <button id="refreshButton" class="icon-button" type="button" data-i18n-title="refresh">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6v5h-5M4 18v-5h5M6.1 9a7 7 0 0 1 11.5-2.6L20 9M4 15l2.4 2.6A7 7 0 0 0 17.9 15" />
            </svg>
          </button>
        </div>
      </header>

      <section class="control-card">
        <div class="control-row">
          <div>
            <label for="ocrToggle" data-i18n="ocrLabel">识别图片文字</label>
            <p data-i18n="ocrHint">OCR 模型已内置，图片只在本机处理。</p>
          </div>
          <label class="switch">
            <input id="ocrToggle" type="checkbox" />
            <span class="switch-track" aria-hidden="true"></span>
          </label>
        </div>
        <div id="ocrSelectionPanel" class="ocr-selection-panel" hidden>
          <div class="ocr-selection-heading">
            <strong data-i18n="ocrSelectionTitle">识别范围</strong>
            <span id="ocrSelectionSummary"></span>
          </div>
          <div class="ocr-selection-options" role="radiogroup">
            <label>
              <input type="radio" name="ocrSelectionMode" value="all" checked />
              <span data-i18n="ocrSelectionAll">全部图片</span>
            </label>
            <label>
              <input type="radio" name="ocrSelectionMode" value="skip-cover" />
              <span data-i18n="ocrSelectionSkipCover">跳过封面</span>
            </label>
            <label>
              <input type="radio" name="ocrSelectionMode" value="custom" />
              <span data-i18n="ocrSelectionCustom">自定义</span>
            </label>
          </div>
          <div id="ocrCustomRangeRow" class="ocr-custom-range" hidden>
            <input
              id="ocrRangeInput"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              data-i18n-placeholder="ocrRangePlaceholder"
              placeholder="例如：2-4 或 1,3-5"
            />
          </div>
          <button id="startOcrButton" class="ocr-start-button" type="button" data-i18n="startOcr">
            开始识别
          </button>
        </div>
      </section>

      <section id="statusPanel" class="status-panel is-working" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText" data-i18n="loadingPage">正在读取当前页面…</span>
      </section>

      <section id="ocrProgressPanel" class="ocr-progress-card" hidden>
        <div class="ocr-progress-header">
          <strong id="ocrStageText">正在准备 OCR</strong>
          <span id="ocrProgressValue">0%</span>
        </div>
        <div
          id="ocrProgressTrack"
          class="ocr-progress-track"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <span id="ocrProgressBar" class="ocr-progress-bar"></span>
        </div>
        <div class="ocr-progress-meta">
          <span id="ocrElapsed"></span>
          <span id="ocrRemaining"></span>
        </div>
        <p id="ocrProgressDetail" class="ocr-progress-detail"></p>
        <div id="ocrStepTimings" class="ocr-step-timings"></div>
        <div class="ocr-progress-actions">
          <button id="pauseOcrButton" class="ocr-action-button" type="button" data-i18n="pauseOcr">
            暂停
          </button>
          <button id="stopOcrButton" class="ocr-action-button is-danger" type="button" data-i18n="stopOcr">
            跳过 OCR
          </button>
        </div>
      </section>

      <section class="preview-card">
        <div class="preview-header">
          <div>
            <h2 data-i18n="previewTitle">Markdown 预览</h2>
            <p id="noteMeta"></p>
          </div>
          <button id="copyButton" class="text-button" type="button" disabled data-i18n="copy">
            复制
          </button>
        </div>
        <textarea
          id="markdownPreview"
          aria-label="Markdown preview"
          spellcheck="false"
          placeholder="Markdown"
        ></textarea>
        <p class="edit-hint" data-i18n="editHint">可以直接修改预览内容，再下载。</p>
      </section>

      <footer class="app-footer">
        <div class="footer-controls">
          <div class="footer-actions">
            <button id="obsidianButton" class="obsidian-button" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h11m-4-4 4 4-4 4M19 5v14" />
              </svg>
              <span data-i18n="writeToObsidian">写入 Obsidian</span>
            </button>
            <button id="downloadButton" class="primary-button" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 20h14" />
              </svg>
              <span data-i18n="download">下载 .md</span>
            </button>
          </div>
          <div id="obsidianFeedback" class="obsidian-feedback" aria-live="polite" aria-hidden="true">
            <span id="obsidianFeedbackIcon" class="obsidian-feedback-icon" aria-hidden="true"></span>
            <span class="obsidian-feedback-copy">
              <strong id="obsidianFeedbackText"></strong>
              <span id="obsidianFeedbackDetail"></span>
            </span>
          </div>
        </div>
      </footer>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
